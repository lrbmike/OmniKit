version: '3.8'

services:
  omnikit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnikit
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/omnikit.db}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to a random string of at least 32 characters}
      - ENABLE_SECURE_COOKIE=${ENABLE_SECURE_COOKIE:-false}
    volumes:
      # Persist SQLite database
      - omnikit-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  omnikit-data:
    driver: local
